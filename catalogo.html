<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIGME - Catálogo Público de Emprendimientos</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Topbar */
    .topbar {
      background: var(--color-ink);
      color: var(--color-crema);
      padding: 0.9rem 2rem;
      border-bottom: 2px solid var(--color-burn-orange);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      color: inherit;
    }

    .brand__name {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      line-height: 1.15;
      color: var(--color-crema);
    }

    .brand__sub {
      font-size: 0.76rem;
      color: var(--color-crema-muted);
      letter-spacing: 0.02em;
    }

    /* Encabezado */
    .catalog-header {
      margin-bottom: 2rem;
    }

    .catalog-header h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      font-weight: 800;
    }

    .catalog-header p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--color-ink-muted);
    }

    /* Barra de Filtros Minimalista */
    .filter-bar {
      background: var(--color-crema-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: 0.75rem 1.25rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .tab-filters {
      display: flex;
      gap: 0.4rem;
    }

    .filter-btn {
      border: 1px solid transparent;
      background: transparent;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--color-ink-muted);
      cursor: pointer;
      transition: all 0.18s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .filter-btn:hover {
      color: var(--color-ink);
      background: var(--color-crema-surface);
    }

    .filter-btn.active {
      background: var(--color-ink);
      color: var(--color-crema);
      border-color: var(--color-ink);
    }

    .filter-btn.active.filter-btn--open {
      background: var(--color-burn-orange);
      border-color: var(--color-burn-orange);
      color: #FFFFFF;
    }

    .search-input {
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      width: 260px;
      outline: none;
      background: #FFFFFF;
      color: var(--color-ink);
      font-family: inherit;
      transition: border-color 0.18s ease;
    }

    .search-input:focus {
      border-color: var(--color-burn-orange);
    }

    /* Grid de Negocios */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
    }

    .venture-card {
      background: var(--color-crema-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-subtle);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .venture-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(17, 17, 17, 0.25);
    }

    .venture-card.is-open {
      border-top: 3px solid var(--color-burn-orange);
    }

    .venture-card.is-closed {
      border-top: 3px solid var(--color-border);
      opacity: 0.82;
    }

    .venture-card__hero {
      height: 140px;
      background: var(--color-crema-surface);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .badge-status {
      position: absolute;
      top: 0.85rem;
      right: 0.85rem;
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .badge-status--open {
      background: var(--color-burn-orange-subtle);
      color: var(--color-burn-orange);
      border: 1px solid var(--color-burn-orange-border);
    }

    .badge-status--closed {
      background: var(--color-crema-muted);
      color: var(--color-ink-muted);
      border: 1px solid var(--color-border);
    }

    .badge-mod {
      position: absolute;
      bottom: 0.85rem;
      left: 0.85rem;
      background: var(--color-ink);
      color: var(--color-crema);
      padding: 0.2rem 0.6rem;
      border-radius: var(--radius-xs);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .venture-card__body {
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .venture-cat {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--color-burn-orange);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.35rem;
    }

    .venture-title {
      margin: 0 0 0.5rem;
      font-size: 1.15rem;
      font-weight: 700;
      line-height: 1.3;
      color: var(--color-ink);
    }

    .venture-desc {
      font-size: 0.86rem;
      color: var(--color-ink-muted);
      margin: 0 0 1.25rem;
      line-height: 1.5;
      flex: 1;
    }

    .venture-footer {
      border-top: 1px solid var(--color-border);
      padding-top: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .student-lbl {
      font-size: 0.76rem;
      color: var(--color-ink-muted);
    }

    .contact-btns {
      display: flex;
      gap: 0.4rem;
    }

    .btn-contact {
      display: inline-flex;
      align-items: center;
      padding: 0.32rem 0.65rem;
      border-radius: var(--radius-xs);
      font-size: 0.76rem;
      font-weight: 600;
      text-decoration: none;
      border: 1px solid var(--color-border);
      background: var(--color-crema-surface);
      color: var(--color-ink);
      transition: all 0.15s ease;
    }

    .btn-contact:hover {
      border-color: var(--color-burn-orange);
      color: var(--color-burn-orange);
      background: var(--color-burn-orange-subtle);
    }
  </style>
</head>
<body>

  <!-- Topbar -->
  <header class="topbar">
    <a class="brand" href="index.html">
      <div class="brand-mark">S</div>
      <div>
        <div class="brand__name">SIGME</div>
        <div class="brand__sub">Catálogo de la Zona de Emprendimiento</div>
      </div>
    </a>
    <div>
      <a class="btn btn--ghost-dark" href="index.html">
        Portal de Acceso / Login &rarr;
      </a>
    </div>
  </header>

  <main class="app-container">

    <div class="catalog-header">
      <h1>Emprendimientos Activos en Campus</h1>
      <p>Visualización en tiempo real del estado de atención de los módulos comerciales universitarios.</p>
    </div>

    <!-- Barra de Filtros -->
    <div class="filter-bar">
      <div class="tab-filters">
        <button class="filter-btn active" id="fAll" onclick="setCatalogFilter('all')">
          Todos (<span id="countAll">4</span>)
        </button>
        <button class="filter-btn filter-btn--open" id="fOpen" onclick="setCatalogFilter('open')">
          <span class="status-dot status-dot--active"></span> Abiertos Ahora (<span id="countOpen">2</span>)
        </button>
        <button class="filter-btn" id="fClosed" onclick="setCatalogFilter('closed')">
          Cerrados (<span id="countClosed">2</span>)
        </button>
      </div>

      <input class="search-input" type="search" id="catalogSearch" placeholder="Buscar por producto, marca o módulo..." oninput="handleSearch(this.value)">
    </div>

    <!-- Grid de Emprendimientos -->
    <div class="catalog-grid" id="catalogGrid">
      <!-- Render dinámico -->
    </div>

  </main>

  <script src="shared-state.js"></script>
  <script>
    let activeFilter = 'all';
    let searchQuery = '';

    function setCatalogFilter(filter) {
      activeFilter = filter;
      document.getElementById('fAll').classList.toggle('active', filter === 'all');
      document.getElementById('fOpen').classList.toggle('active', filter === 'open');
      document.getElementById('fClosed').classList.toggle('active', filter === 'closed');
      renderCatalog();
    }

    function handleSearch(q) {
      searchQuery = q.toLowerCase().trim();
      renderCatalog();
    }

    function renderCatalog() {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      const ventures = SIGME_STATE.getVentures();

      // ORDENAR: ABIERTOS PRIMERO
      let sorted = [...ventures].sort((a, b) => {
        if (a.isOpen === b.isOpen) return 0;
        return a.isOpen ? -1 : 1;
      });

      // Filtrar
      let filtered = sorted.filter(v => {
        if (activeFilter === 'open' && !v.isOpen) return false;
        if (activeFilter === 'closed' && v.isOpen) return false;
        if (searchQuery) {
          return v.name.toLowerCase().includes(searchQuery) ||
                 v.category.toLowerCase().includes(searchQuery) ||
                 v.desc.toLowerCase().includes(searchQuery) ||
                 v.module.toLowerCase().includes(searchQuery);
        }
        return true;
      });

      // Contadores
      const openCount = ventures.filter(v => v.isOpen).length;
      document.getElementById('countAll').textContent = ventures.length;
      document.getElementById('countOpen').textContent = openCount;
      document.getElementById('countClosed').textContent = ventures.length - openCount;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1/-1; text-align:center; padding: 3.5rem 1rem; color: var(--color-ink-muted);">
            No se encontraron emprendimientos que coincidan con los criterios de búsqueda.
          </div>
        `;
        return;
      }

      filtered.forEach(v => {
        const card = document.createElement('article');
        card.className = `venture-card ${v.isOpen ? 'is-open' : 'is-closed'}`;

        const monogram = v.monogram || (v.name.split(' ').map(w => w[0]).join('').slice(0, 2)).toUpperCase();

        card.innerHTML = `
          <div class="venture-card__hero">
            <div class="monogram-badge">${monogram}</div>
            <span class="badge-status ${v.isOpen ? 'badge-status--open' : 'badge-status--closed'}">
              <span class="status-dot ${v.isOpen ? 'status-dot--active' : ''}"></span>
              ${v.isOpen ? 'Abierto' : 'Cerrado'}
            </span>
            <span class="badge-mod">${v.module}</span>
          </div>
          <div class="venture-card__body">
            <div class="venture-cat">${v.category}</div>
            <h3 class="venture-title">${v.name}</h3>
            <p class="venture-desc">${v.desc}</p>
            <div class="venture-footer">
              <span class="student-lbl">Líder: ${v.student}</span>
              <div class="contact-btns">
                <a class="btn-contact" href="https://wa.me/${v.phone}" target="_blank" title="Contactar por WhatsApp">
                  WhatsApp
                </a>
                <a class="btn-contact" href="https://instagram.com/${v.ig}" target="_blank" title="Instagram">
                  Instagram
                </a>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    renderCatalog();
    // Reactividad en tiempo real entre pestañas
    window.addEventListener('storage', () => {
      renderCatalog();
    });
  </script>
</body>
</html>
